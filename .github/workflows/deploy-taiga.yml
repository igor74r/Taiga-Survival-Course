name: Deploy TAIGA browser game

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: taiga-browser-game
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload repository site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy browser game
        id: deployment
        uses: actions/deploy-pages@v4
