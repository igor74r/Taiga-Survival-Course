<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17251f"><link rel="manifest" href="./manifest.webmanifest"><title>TAIGA — IDLE SURVIVAL</title>
<style>
:root{color-scheme:dark;--bg:#101914;--panel:#1c2b23;--panel2:#26382d;--line:#405548;--text:#e9eadf;--muted:#aab7a8;--green:#91ad7b;--gold:#d2ae70;--red:#d77c68}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#3b5842 0,#17251e 45%,#0d1511 100%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;border:1px solid var(--line);background:#304538;border-radius:12px;padding:11px 13px;cursor:pointer}button:active{transform:scale(.98)}button:disabled{opacity:.38;cursor:not-allowed}
.app{max-width:760px;margin:auto;padding:14px 13px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:5px 2px 14px}.brand{font-weight:900;letter-spacing:2px;font-size:20px}.sub{color:var(--muted);font-size:11px;letter-spacing:1.5px}.day{color:var(--gold);font-size:13px;text-align:right}
.scene{border:1px solid #536b56;border-radius:18px;overflow:hidden;min-height:170px;padding:18px;background:linear-gradient(180deg,rgba(10,20,15,.12),rgba(10,20,15,.72)),linear-gradient(145deg,#60745a 0%,#344e3d 38%,#1d3028 70%,#17231e 100%);position:relative}
.scene:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,transparent 0 35px,rgba(10,20,15,.12) 36px 38px);pointer-events:none}
.scene>*{position:relative}.scene h1{font-size:24px;margin:3px 0 5px}.scene p{color:#d1d9cb;max-width:520px;margin:0;line-height:1.45}.weather{font-size:12px;color:#e3d5ad}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat,.panel{background:rgba(28,43,35,.94);border:1px solid var(--line);border-radius:14px;padding:11px}.stat-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.track{height:7px;background:#0d1711;border-radius:9px;margin-top:7px;overflow:hidden}.fill{height:100%;border-radius:9px;background:var(--green)}.fill.warn{background:var(--gold)}.fill.bad{background:var(--red)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}.tabs button{padding:10px 3px;font-size:12px;background:#1b2a21}.tabs button.active{background:#536c50;border-color:#a0b78b}
.panel{margin:10px 0}.panel h2{font-size:16px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.item{padding:10px;background:#24352b;border:1px solid #3c5142;border-radius:12px}.item b{display:block;font-size:14px}.item small{color:var(--muted)}.item button{width:100%;margin-top:8px;padding:8px;font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.resource-list{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.resource{background:#24352b;border-radius:10px;padding:9px;font-size:12px}.resource b{display:block;font-size:16px;color:#e5e8d9}.action{width:100%;text-align:left;margin:5px 0;background:#26392d}.action span{float:right;color:var(--gold);font-size:12px}.notice{padding:10px 12px;border-left:3px solid var(--gold);background:#263329;border-radius:8px;margin:8px 0;font-size:13px}.log{max-height:150px;overflow:auto;font-size:12px;color:var(--muted);line-height:1.6}.footer{color:#7f9182;text-align:center;font-size:11px;margin-top:20px}
@media(max-width:430px){.stats{grid-template-columns:repeat(2,1fr)}.tabs button{font-size:11px}.scene h1{font-size:21px}.resource-list{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main class="app">
<header class="top"><div><div class="brand">TAIGA <span style="color:var(--green)">/</span> IDLE SURVIVAL</div><div class="sub">ИСТОРИЯ ОДИНОКОГО ВЫЖИВАНИЯ</div></div><div class="day" id="day">ДЕНЬ 1<br>07:00</div></header>
<section class="scene"><div class="weather" id="weather">☁ Прохладно · раннее утро</div><h1 id="place">Лесная стоянка</h1><p id="sceneText">Самолёт исчез за грядой холмов. Вокруг только тайга, шум ветра и старый охотничий навес. Нужно пережить первую ночь.</p></section>
<section class="stats" id="stats"></section>
<nav class="tabs" id="tabs"><button data-tab="camp" class="active">🏕 Лагерь</button><button data-tab="work">🪓 Работы</button><button data-tab="craft">🛠 Крафт</button><button data-tab="map">🧭 Карта</button><button data-tab="bag">🎒 Склад</button></nav>
<section id="view"></section>
<section class="panel"><h2>📓 Полевой журнал</h2><div class="log" id="log"></div></section>
<div class="footer">TAIGA — IDLE SURVIVAL · Автосохранение включено</div></main>
<script>
const KEY='taiga_idle_save_v1';
const fresh=()=>({version:1,day:1,hour:7,last:Date.now(),hp:100,hunger:82,thirst:78,energy:90,warmth:85,morale:75,wood:4,branch:5,stone:1,berry:2,mushroom:0,water:2,fish:0,metal:0,cloth:0,food:1,knife:0,base:0,fire:0,fireMinutes:0,torch:0,known:['camp','river','forest'],jobs:[],crafted:[],log:['Вы очнулись у старого охотничьего навеса. Сначала найдите воду и топливо.'],tab:'camp',story:0});
let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){s=fresh()}\ns={...fresh(),...s,fireMinutes:Number(s.fireMinutes)||0,torch:Number(s.torch)||0,jobs:Array.isArray(s.jobs)?s.jobs:[],known:Array.isArray(s.known)?s.known:['camp','river','forest'],log:Array.isArray(s.log)?s.log:[]};
const defs={wood:'Древесина',branch:'Ветки',stone:'Камень',berry:'Ягоды',mushroom:'Грибы',water:'Чистая вода',fish:'Рыба',metal:'Металл',cloth:'Ткань',food:'Приготовленная еда',knife:'Костяной нож',torch:'Факел'};
const $=id=>document.getElementById(id);const clamp=n=>Math.max(0,Math.min(100,n));const fmt=n=>Math.floor(n);
function save(){s.last=Date.now();localStorage.setItem(KEY,JSON.stringify(s))}
function say(t){s.log.unshift('День '+s.day+': '+t);s.log=s.log.slice(0,18);$('log').innerHTML=s.log.map(x=>'• '+x).join('<br>');save()}
function spend(cost){for(const [k,v] of Object.entries(cost))if((s[k]||0)<v)return false;for(const [k,v] of Object.entries(cost))s[k]-=v;return true}
function gain(rew){for(const [k,v] of Object.entries(rew))s[k]=(s[k]||0)+v}
function advance(min){let total=s.hour*60+min;while(total>=1440){total-=1440;s.day++;}s.hour=Math.floor(total/60);const warmMinutes=Math.min(min,Math.max(0,s.fireMinutes||0));s.fireMinutes=Math.max(0,(s.fireMinutes||0)-min);s.fire=s.fireMinutes>0?1:0;const coldHours=(min-warmMinutes)/60;const warmHours=warmMinutes/60;const h=min/60;s.hunger=clamp(s.hunger-h*.72);s.thirst=clamp(s.thirst-h*1.05);s.energy=clamp(s.energy-h*.22);s.warmth=clamp(s.warmth+coldHours*-.28+warmHours*.18);s.morale=clamp(s.morale-h*.06);if(s.hunger===0)s.hp=clamp(s.hp-h*.8);if(s.thirst===0)s.hp=clamp(s.hp-h*1.6);if(s.warmth<20)s.hp=clamp(s.hp-h*.7);if(s.hp===0){s.hp=1;s.morale=clamp(s.morale-10);say('Вы потеряли сознание, но очнулись у стоянки. Сил почти не осталось.');}completeJobs(min);save()}
function completeJobs(min){for(const j of s.jobs){if(j.left>0){let before=j.left;j.left=Math.max(0,j.left-min);let done=before-j.left;if(j.left===0&&!j.paid){gain(j.reward);j.paid=true;say('Завершена работа: '+j.name+'. Ресурсы доставлены в лагерь.')}}}s.jobs=s.jobs.filter(j=>!j.paid)}
function tickOffline(){let elapsed=Math.max(0,Math.min(8*3600000,Date.now()-s.last));if(elapsed>60000){let mins=Math.floor(elapsed/60000);advance(mins);say('Пока вас не было ('+Math.floor(mins/60)+' ч. '+mins%60+' мин.), лагерь жил своей жизнью.');}}
function bar(label,key,icon){let v=fmt(s[key]);return '<div class="stat"><div class="stat-head"><span>'+icon+' '+label+'</span><b>'+v+'%</b></div><div class="track"><div class="fill '+(v<25?'bad':v<50?'warn':'')+'" style="width:'+v+'%"></div></div></div>'}
function render(){ $('day').innerHTML='ДЕНЬ '+s.day+'<br>'+String(s.hour).padStart(2,'0')+':00';$('stats').innerHTML=bar('Здоровье','hp','❤')+bar('Сытость','hunger','🍲')+bar('Жажда','thirst','💧')+bar('Бодрость','energy','⚡')+bar('Тепло','warmth','♨')+bar('Мораль','morale','☀');
$('weather').textContent=(s.hour<6||s.hour>19?'☾ Ночная прохлада':'☁ Прохладно')+' · '+(s.fire?'у костра тепло':'ветер в кронах');$('log').innerHTML=s.log.map(x=>'• '+x).join('<br>');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===s.tab));renderView();}
function btn(label,desc,cost,fn,disabled=false){return '<div class="item"><b>'+label+'</b><small>'+desc+'</small><button '+(disabled?'disabled':'')+' onclick="'+fn+'">'+cost+'</button></div>'}
function resources(){return '<div class="resource-list">'+Object.entries(defs).map(([k,n])=>'<div class="resource">'+n+'<b>'+(s[k]||0)+'</b></div>').join('')+'</div>'}
function canExplore(p){const gates={base:()=>s.base>0,hut:()=>s.known.includes('hut'),road:()=>s.known.includes('road')};return p[3]===true||!p[3]||(typeof p[3]==='string'&&!!gates[p[3]]&&gates[p[3]]());}\nfunction renderView(){let v='';
if(s.tab==='camp'){v='<div class="panel"><h2>🏕 Убежище</h2><p class="muted">'+(s.base?'Небольшой укреплённый лагерь. Здесь можно переждать непогоду.':'Временная стоянка почти не защищает от холода. Постройте простое укрытие.')+'</p><div class="row"><span>Уровень лагеря</span><b>'+(s.base+1)+'</b></div><div class="track"><div class="fill" style="width:'+(s.base?65:18)+'%"></div></div></div><div class="grid">'+btn('🔥 Развести костёр','Согревает и помогает готовить.','2 ветки · 1 древесина','act(\'fire\')',s.fire>0||s.branch<2||s.wood<1)+btn('💧 Выпить воды','Восстанавливает жажду.','−1 вода','act(\'drink\')',s.water<1)+btn('🍲 Поесть','Восстанавливает сытость.','−1 еда','act(\'eat\')',s.food<1)+btn('😴 Отдохнуть','Восстановить силы за 2 часа.','2 часа','act(\'rest\')',false)+btn('🛖 Укрепить навес','Повышает защиту от холода.','6 древесины · 4 ветки','act(\'base\')',s.base>0||s.wood<6||s.branch<4)+'</div>';}
if(s.tab==='work'){const jobs=[['Собирать ветки','branch',3,20,{branch:3},{}],['Рубить сухостой','wood',3,35,{wood:3},{energy:5}],['Собирать ягоды','berry',2,25,{berry:2},{energy:3}],['Искать камень','stone',2,40,{stone:2},{energy:8}],['Набирать воду','water',3,20,{water:3},{energy:2}],['Проверить ручей','fish',1,60,{fish:1},{energy:8}]];v='<div class="panel"><h2>🪓 Назначить работу</h2><p class="muted">Работа продолжается, даже когда приложение закрыто. Время офлайн-прогресса ограничено 8 часами.</p><div class="grid">'+jobs.map((j,i)=>btn(j[0], 'Результат: '+j[4][j[1]]+' · '+j[3]+' мин.',j[3]+' мин.','startJob('+i+')',s.jobs.length>=2||s.energy<(j[5].energy||0))).join('')+'</div></div><div class="panel"><h2>Активные работы</h2>'+(s.jobs.length?s.jobs.map(j=>'<div class="notice">'+j.name+' — осталось '+j.left+' мин.</div>').join(''):'<p class="muted">Пока никто не работает.</p>')+'</div>';}
if(s.tab==='craft'){const recipes=[['Костяной нож',{branch:2,stone:1},{knife:1},'knife'],['Сухой паёк',{berry:2,water:1},{food:1},'meal'],['Простое укрытие',{wood:6,branch:4},{base:1},'shelter'],['Факел',{branch:2,wood:1},{torch:1},'torch'],['Грибной отвар',{mushroom:2,water:1},{food:2},'broth']];v='<div class="panel"><h2>🛠 Ремесло и подготовка</h2><p class="muted">Рецепты требуют реальные ресурсы. Изготовленные предметы сразу поступают в лагерь.</p><div class="grid">'+recipes.map((r,i)=>btn(r[0],'Нужно: '+Object.entries(r[1]).map(([k,n])=>n+' '+defs[k]).join(', '),'Изготовить','craft('+i+')',Object.entries(r[1]).some(([k,n])=>(s[k]||0)<n)|| (r[3]==='shelter'&&s.base>0))).join('')+'</div></div>';}
if(s.tab==='map'){let places=[['camp','🏕 Лесная стоянка','Безопасное место, ваш временный лагерь.',true],['river','🌊 Лесной ручей','Вода и шанс поймать рыбу.',true],['forest','🌲 Глухой лес','Ветки, ягоды и сухостой.',true],['hut','🛖 Заброшенный кордон','Следы прежних обитателей.','base'],['road','🛤 Старая просека','Заросшая дорога на север.','hut'],['marsh','🌫 Тихое болото','Опасная местность, но здесь можно найти редкие материалы.','road']];v='<div class="panel"><h2>🧭 Окрестности</h2><p class="muted">Исследуйте точки постепенно. Дальние маршруты требуют припасов.</p><div class="grid">'+places.map((p,i)=>btn(p[1],p[2],s.known.includes(p[0])?'Изучено':'Разведать · 1 час','explore('+i+')',s.known.includes(p[0])||!canExplore(p)||s.energy<12)).join('')+'</div></div>';}
if(s.tab==='bag'){v='<div class="panel"><h2>🎒 Запасы лагеря</h2>'+resources()+'</div><div class="panel"><h2>Состояние</h2><p class="muted">Здоровье '+fmt(s.hp)+' · Сытость '+fmt(s.hunger)+' · Жажда '+fmt(s.thirst)+' · Усталость '+fmt(100-s.energy)+' · Тепло '+fmt(s.warmth)+'</p><button onclick="manualSave()">Сохранить сейчас</button> <button onclick="resetGame()" style="background:#54352e">Начать заново</button></div>';}
$('view').innerHTML=v;}
window.act=function(a){if(a==='fire'){spend({branch:2,wood:1});s.fire=1;s.fireMinutes=180;s.warmth=clamp(s.warmth+12);say('Костёр разгорелся. Теперь можно согреться.');}if(a==='drink'&&spend({water:1})){s.thirst=clamp(s.thirst+32);say('Вы выпили чистой воды.');}if(a==='eat'&&spend({food:1})){s.hunger=clamp(s.hunger+30);s.morale=clamp(s.morale+3);say('Горячая еда возвращает силы.');}if(a==='rest'){advance(120);s.energy=clamp(s.energy+38);s.hp=clamp(s.hp+4);say('Вы немного поспали у стоянки.');}if(a==='base'&&spend({wood:6,branch:4})){s.base=1;s.warmth=clamp(s.warmth+10);say('Навес укреплён. Ночью будет безопаснее.');}render();save()};
window.startJob=function(i){const jobs=[['Собирать ветки',20,{branch:3},2],['Рубить сухостой',35,{wood:3},5],['Собирать ягоды',25,{berry:2},3],['Искать камень',40,{stone:2},8],['Набирать воду',20,{water:3},2],['Проверить ручей',60,{fish:1},8]];let j=jobs[i];if(!j||s.jobs.length>=2||s.energy<j[3])return;s.energy=clamp(s.energy-j[3]);s.jobs.push({name:j[0],left:j[1],reward:j[2],paid:false});say('Назначена работа: '+j[0]+'. Потрачено бодрости: '+j[3]+'.');advance(1);render()};
window.craft=function(i){let r=[['Костяной нож',{branch:2,stone:1},{knife:1}],['Сухой паёк',{berry:2,water:1},{food:1}],['Простое укрытие',{wood:6,branch:4},{base:1}],['Факел',{branch:2,wood:1},{fire:1}],['Грибной отвар',{mushroom:2,water:1},{food:2}]][i];if(!spend(r[1]))return;gain(r[2]);advance(10);say('Изготовлено: '+r[0]+'.');render()};
window.explore=function(i){let p=[['camp','Лесная стоянка',null,true],['river','Лесной ручей',null,true],['forest','Глухой лес',null,true],['hut','Заброшенный кордон',null,'base'],['road','Старая просека',null,'hut'],['marsh','Тихое болото',null,'road']][i];if(!p||s.known.includes(p[0]))return;if(!canExplore(p)||s.energy<12){say('Путь пока недоступен: укрепите лагерь, изучите предыдущую точку и восстановите бодрость.');return;}s.energy=clamp(s.energy-12);advance(60);s.known.push(p[0]);if(p[0]==='river')gain({water:2});if(p[0]==='forest')gain({branch:2,berry:1});if(p[0]==='hut')gain({wood:2,cloth:1});if(p[0]==='road')gain({metal:1});if(p[0]==='marsh')gain({mushroom:2});say('Вы исследовали: '+p[1]+'. Найденные припасы добавлены в склад.');render()};
window.manualSave=function(){save();say('Сохранение записано.');render()};window.resetGame=function(){if(confirm('Удалить текущее сохранение и начать заново?')){s=fresh();save();render()}};
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{s.tab=b.dataset.tab;render();save()}));
tickOffline();render();if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});setInterval(()=>{advance(1);render()},60000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{tickOffline();render()}});
</script></body></html>
