name: Deploy TAIGA game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "GAME_TAIGA_IDLE/**"
      - ".github/workflows/deploy-taiga-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: taiga-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload game site
        uses: actions/upload-pages-artifact@v3
        with:
          path: GAME_TAIGA_IDLE

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
